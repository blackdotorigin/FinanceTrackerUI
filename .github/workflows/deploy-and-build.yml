name: Build frontend and Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebApp
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://financetracker-iulg.onrender.com' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WebApp/package-lock.json

      - name: Require API URL for production deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "Set the VITE_API_BASE_URL repository variable before deploying."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebApp
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://financetracker-iulg.onrender.com' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WebApp/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Require API URL
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "Set the VITE_API_BASE_URL repository variable before building the APK."
            exit 1
          fi

      - name: Build debug APK
        run: npm run android:apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: financeflow-debug-apk
          path: WebApp/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
