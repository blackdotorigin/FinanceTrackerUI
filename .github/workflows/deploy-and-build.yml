name: Build and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebApp
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WebApp/package-lock.json

      - name: Require API URL for production deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "Set the VITE_API_BASE_URL repository variable before deploying."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Upload Pages build
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: WebApp/dist
          if-no-files-found: error
          retention-days: 1

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebApp
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WebApp/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Require API URL
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "Set the VITE_API_BASE_URL repository variable before building the APK."
            exit 1
          fi

      - name: Build debug APK
        run: npm run android:apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: financeflow-debug-apk
          path: WebApp/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Download Pages build
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: WebApp/dist

      - name: Check Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Configure the CLOUDFLARE_API_TOKEN GitHub secret before deploying."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Configure the CLOUDFLARE_ACCOUNT_ID GitHub secret before deploying."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_PAGES_PROJECT_NAME" ]; then
            echo "Configure the CLOUDFLARE_PAGES_PROJECT_NAME GitHub variable before deploying."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          workingDirectory: WebApp
